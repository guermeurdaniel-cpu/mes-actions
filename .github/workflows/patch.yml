name: Patch par remplacements

# Applique outils/patch.py quand ce script est modifie : petits remplacements de
# texte dans un ou plusieurs fichiers du depot (index.html, veille.py, regles.md...),
# sans renvoyer les fichiers entiers. Verifie ensuite le JavaScript de la page
# (node --check) et la syntaxe Python de veille.py, puis committe.
# Un commit fait par ce workflow ne relance pas les autres workflows.

on:
  push:
    branches: [ main ]
    paths: [ 'outils/patch.py' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Application du patch
        run: python3 -B outils/patch.py

      - name: Controles
        run: |
          python3 -B - <<'PY'
          import ast, re
          s = open("index.html", encoding="utf-8").read()
          js = "\n".join(re.findall(r"<script[^>]*>(.*?)</script>", s, re.S))
          open("/tmp/page.js", "w", encoding="utf-8").write(js)
          ast.parse(open("veille.py", encoding="utf-8").read())
          print("veille.py : syntaxe correcte")
          PY
          node --check /tmp/page.js

      - name: Commit
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add -A -- . ':!outils'
          git commit -m "patch applique par outils/patch.py" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
