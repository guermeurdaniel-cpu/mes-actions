name: Patch de la page

# Applique outils/patch.py a index.html quand ce script est modifie, verifie le
# JavaScript de la page (node --check) et committe le resultat. Permet de
# corriger la page par petits remplacements, sans renvoyer ses 85 Ko.

on:
  push:
    branches: [ main ]
    paths: [ 'outils/patch.py' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Application du patch
        run: python3 outils/patch.py

      - name: Controle du JavaScript
        run: |
          python3 - <<'PY'
          import re
          s = open("index.html", encoding="utf-8").read()
          js = "\n".join(re.findall(r"<script[^>]*>(.*?)</script>", s, re.S))
          open("/tmp/page.js", "w", encoding="utf-8").write(js)
          PY
          node --check /tmp/page.js

      - name: Commit
        run: |
          git config user.name "patch-bot"
          git config user.email "patch-bot@users.noreply.github.com"
          git add index.html
          git commit -m "index.html : patch applique par outils/patch.py" || exit 0
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
