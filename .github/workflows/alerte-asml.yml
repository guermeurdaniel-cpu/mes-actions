name: Alerte ASML

on:
  schedule:
    # Toutes les 5 minutes, de 8h a 18h UTC (= 9h-19h Paris hiver, 10h-20h ete)
    - cron: "*/5 8-18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-asml:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Verifier le franchissement de bande ASML
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json, sys, datetime, os, time

          SYMBOL     = "ASML.AS"
          BORNE_BAS  = -3.0   # % sous la cloture de la seance precedente
          BORNE_HAUT =  3.0   # % au-dessus de la cloture de la seance precedente
          STATE_FILE = "alerte_asml_state.json"
          UA         = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          CHART      = "https://query1.finance.yahoo.com/v8/finance/chart/"

          TOKEN   = os.environ.get("TELEGRAM_TOKEN","")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID","")

          def http_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          def jour_de(sec, off):
              # Horodatages Yahoo en UTC : on ajoute le decalage de la place avant de dater.
              return datetime.datetime.fromtimestamp(sec + off, datetime.timezone.utc).strftime("%Y-%m-%d")

          def serie(res):
              meta   = res["meta"]
              off    = meta.get("gmtoffset") or 0
              ts     = res.get("timestamp") or []
              closes = (res.get("indicators", {}).get("quote") or [{}])[0].get("close") or []
              return meta, off, ts, closes

          def cloture_intraday(symbol, jour):
              """Derniere bougie horaire non nulle de la journee demandee.
              Sert quand la serie journaliere renvoie la seance avec close = null."""
              try:
                  res = http_json(CHART + symbol + "?range=1mo&interval=60m")["chart"]["result"][0]
              except Exception as e:
                  print(f"[alerte] Rattrapage horaire impossible : {e}")
                  return None
              _, off, ts, closes = serie(res)
              val = None
              for t, c in zip(ts, closes):
                  if c is not None and jour_de(t, off) == jour:
                      val = c
              return val

          # --- Cours du jour et cloture de la seance precedente ------------------------
          # range=1mo pour disposer du calendrier boursier complet : Yahoo renvoie la ligne
          # de chaque seance meme quand la cloture manque (close = null). On ne se sert PAS
          # de meta.chartPreviousClose, qui designe la seance precedant la fenetre demandee
          # et non la veille : avec range=1mo il vaut la cloture d il y a un mois.
          try:
              res = http_json(CHART + SYMBOL + "?range=1mo&interval=1d")["chart"]["result"][0]
          except Exception as e:
              print(f"[alerte] Impossible de joindre Yahoo : {e}")
              sys.exit(0)

          try:
              meta, off, ts, closes = serie(res)
              price = meta.get("regularMarketPrice")
              jours = [jour_de(t, off) for t in ts]
              mt    = meta.get("regularMarketTime")
              ref_day = jour_de(mt if mt else int(time.time()), off)
          except Exception as e:
              print(f"[alerte] Format Yahoo inattendu : {e}")
              sys.exit(0)

          idx_courant = -1
          for i in range(len(jours) - 1, -1, -1):
              if jours[i] == ref_day:
                  idx_courant = i
                  break
          # Bougie du jour presente -> la veille est juste avant.
          # Bougie du jour absente  -> la veille est la derniere ligne.
          if   idx_courant > 0: idx_veille = idx_courant - 1
          elif idx_courant < 0: idx_veille = len(jours) - 1
          else:                 idx_veille = -1

          prev, prev_date, source = None, None, ""
          if idx_veille >= 0:
              prev_date = jours[idx_veille]
              if closes[idx_veille] is not None:
                  prev, source = closes[idx_veille], "serie journaliere"
              else:
                  prev = cloture_intraday(SYMBOL, prev_date)
                  source = "rattrapage horaire" if prev is not None else "introuvable"

          if price is None or not prev:
              # Sans reference fiable, une bande a +/-3% ne veut rien dire :
              # on ne declenche rien et on laisse l'etat inchange.
              print(f"[alerte] Reference de veille indisponible (seance {prev_date}) — aucune alerte.")
              sys.exit(0)

          change = (price - prev) / prev * 100
          today  = ref_day   # jour de bourse, pas la date UTC du runner

          # --- Etat precedent ---------------------------------------------------------
          state = {"date": None, "in_band": True}
          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE) as f:
                      state = json.load(f)
              except Exception:
                  pass
          if state.get("date") != today:
              state["in_band"] = True
              state["date"]    = today

          now = datetime.datetime.now(datetime.timezone.utc).strftime("%H:%M UTC")
          print(f"[alerte] {SYMBOL}  cours={price:.2f} EUR  veille={prev:.2f} EUR ({prev_date}, {source})  "
                f"variation={change:+.2f}%  bande=[{BORNE_BAS:+.0f}%,{BORNE_HAUT:+.0f}%]  [{now}]")

          current_in_band = (BORNE_BAS <= change <= BORNE_HAUT)
          was_in_band     = state["in_band"]
          franchissement  = was_in_band and not current_in_band
          direction = ("BASSE \u2b07\ufe0f" if change < BORNE_BAS else "HAUTE \u2b06\ufe0f") if not current_in_band else ""

          print(f"[alerte] Precedemment dans la bande : {was_in_band}  |  Actuellement : {current_in_band}")

          state["in_band"] = current_in_band
          state["date"]    = today
          with open(STATE_FILE, "w") as f:
              json.dump(state, f, indent=2)

          if franchissement:
              emoji = "\U0001f534" if change < 0 else "\U0001f7e2"
              msg = (
                  f"{emoji} ALERTE ASML \u2014 Franchissement borne {direction}\n"
                  f"Cours : {price:.2f} EUR\n"
                  f"Variation : {change:+.2f}% (veille {prev_date} : {prev:.2f} EUR)\n"
                  f"Bande : [{BORNE_BAS:+.0f}%, {BORNE_HAUT:+.0f}%]\n"
                  f"Heure : {now}"
              )
              print(f"[ALERTE] {msg}")
              if TOKEN and CHAT_ID:
                  tg_url  = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
                  payload = json.dumps({"chat_id": CHAT_ID, "text": msg}).encode()
                  tg_req  = urllib.request.Request(tg_url, data=payload,
                              headers={"Content-Type": "application/json"})
                  try:
                      with urllib.request.urlopen(tg_req, timeout=10) as r:
                          resp = json.load(r)
                      print("[alerte] Message Telegram envoye." if resp.get("ok") else f"[alerte] Telegram erreur : {resp}")
                  except Exception as e:
                      print(f"[alerte] Telegram indisponible : {e}")
              else:
                  print("[alerte] Secrets Telegram absents \u2014 message non envoye.")
          else:
              print(f"[OK] {'Dans la bande' if current_in_band else 'Hors bande mais deja sorti precedemment'} ({change:+.2f}%).")

          sys.exit(0)
          PYEOF

      - name: Commiter l'etat mis a jour
        if: always()
        run: |
          git config user.name "alerte-bot"
          git config user.email "alerte-bot@users.noreply.github.com"
          git add alerte_asml_state.json
          git diff --staged --quiet || git commit -m "Etat alerte ASML $(date +%Y-%m-%d\ %H:%M)"
          git push || echo "Rien a pousser"
