name: Verification secrets Telegram

# Controle ponctuel : dit si TELEGRAM_TOKEN et TELEGRAM_CHAT_ID existent dans les
# secrets du depot, sans jamais afficher leur valeur, et envoie un message de
# test si les deux sont presents. Le resultat est ecrit dans verif_secrets.txt.
# Relancable a la main (Actions > Verification secrets Telegram > Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/verif-secrets.yml' ]

permissions:
  contents: write

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controle
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          {
            echo "Verification du $(date -u +%Y-%m-%dT%H:%MZ)"
            if [ -n "$TOKEN" ]; then echo "TELEGRAM_TOKEN : present"; else echo "TELEGRAM_TOKEN : ABSENT"; fi
            if [ -n "$CHAT" ];  then echo "TELEGRAM_CHAT_ID : present"; else echo "TELEGRAM_CHAT_ID : ABSENT"; fi
            if [ -n "$TOKEN" ] && [ -n "$CHAT" ]; then
              CODE=$(curl -s -o /tmp/rep.json -w "%{http_code}" \
                "https://api.telegram.org/bot${TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${CHAT}" \
                --data-urlencode "text=Test mes-actions : les secrets Telegram du depot fonctionnent.")
              if [ "$CODE" = "200" ]; then echo "Message de test : envoye (HTTP 200)"
              else echo "Message de test : ECHEC (HTTP $CODE) - $(grep -o '\"description\":\"[^\"]*\"' /tmp/rep.json)"; fi
            fi
          } > verif_secrets.txt
          cat verif_secrets.txt

      - name: Commit du resultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add verif_secrets.txt
          git commit -m "verif secrets Telegram" || exit 0
          git push
